name: CI

# Checks every push and pull request; on pushes to main and feat/platform,
# deploys through Dokploy once everything is green (docs/brief.md §16).
on:
  push:
    branches: [main, feat/platform]
  pull_request:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Record Linux visual baselines and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: mk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk -d mk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://mk:mk@localhost:5432/mk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      # Guardrail: the build must never need a database (brief §5.6).
      - name: Build with an unreachable database
        run: pnpm build
        env:
          DATABASE_URL: postgres://nobody:nothing@127.0.0.1:1/unreachable
          SITE_URL: https://example.com

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: mk_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mk -d mk_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL_E2E: postgres://mk:mk@localhost:5432/mk_e2e
      SMTP_URL_E2E: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # Fails fast on a migration or seeding problem; Playwright's global
      # setup reseeds before the tests run.
      - run: pnpm e2e:seed
      # Visual snapshots run in the visual job (Linux image); budgets in the
      # next step.
      - name: E2E (desktop, without visual snapshots, budgets or perf)
        run: pnpm test:e2e --project=desktop --project=admin-desktop --grep-invert "parity:|visual:|lighthouse:|budget:|perf:"
        env:
          E2E_SKIP_BUILD: "1"
      # docs/brief.md §16 Quality row; Ruling R10. Lighthouse 13.5 needs
      # Node ≥ 22.19 (setup-node 22 installs the latest 22.x).
      - name: Quality budgets (Lighthouse, images, JavaScript)
        run: pnpm test:e2e --project=desktop --project=mobile --project=admin-desktop --grep "lighthouse:|budget:"
        env:
          E2E_SKIP_BUILD: "1"
      # Ruling R19: tracking specs switch shared site settings on, so they run
      # in their own invocation after the main E2E run.
      - name: E2E (tracking and consent)
        run: pnpm test:e2e:tracking
        env:
          E2E_SKIP_BUILD: "1"
      # Ruling R17: appearance specs publish themes, so they run in their own
      # invocation too.
      - name: E2E (appearance)
        run: pnpm test:e2e:appearance
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Ruling R11: snapshots compare only inside the image that recorded them
  # (scripts/visual-baselines-linux.sh uses the same one).
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mk
          POSTGRES_PASSWORD: mk
          POSTGRES_DB: mk_e2e
        options: >-
          --health-cmd "pg_isready -U mk -d mk_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
    env:
      DATABASE_URL_E2E: postgres://mk:mk@postgres:5432/mk_e2e
      SMTP_URL_E2E: smtp://mailpit:1025
      MAILPIT_URL: http://mailpit:8025
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Visual parity and admin snapshots (Linux baselines)
        run: >-
          pnpm test:e2e --project=desktop --project=tablet --project=mobile
          --project=admin-desktop --project=admin-tablet --project=admin-mobile
          --grep "parity:|visual:" ${{ inputs.update_baselines && '--update-snapshots' || '' }}
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.update_baselines }}
        with:
          name: linux-baselines
          path: tests/e2e/__screenshots__/linux
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7

  # docs/brief.md §16 step 8 (Ruling R12): deploy only after every check is
  # green. Dokploy's own auto-deploy is turned off (docs/runbook.md).
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/platform')
    needs: [check, e2e, visual]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Trigger the Dokploy deploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "::warning::Dokploy secrets are not set for this environment; nothing was deployed."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"
          echo "Deploy of ${GITHUB_SHA} requested."
