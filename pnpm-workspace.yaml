packages: []

overrides:
  # react-email 6.11.0 re-exports render/toPlainText from a ">=2.1.0" range.
  "@react-email/render": "2.1.0"
  # schema-dts 2.0.0 asks for "^1.0.0"; 1.1.0 is newer than the 2-week rule.
  "schema-dts-lib": "1.0.0"
  # Security floors for transitive deps (pnpm audit, 2026-10-31).
  "undici@>=7.0.0 <7.30.1": "7.30.1"
  "undici@>=8.0.0 <8.12.2": "8.12.2"
  "body-parser@>=2.0.0 <2.4.0": "2.4.0"
  "systeminformation@<5.33.16": "5.33.16"
  "zod@<4.6.6": "4.6.6"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  msw: false
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 ReDoS: no patched release exists. Reached only through
    # micromatch/fast-glob in eslint-config-next and the shadcn CLI. shadcn
    # stays a prod dependency (site.css and admin.css import
    # shadcn/tailwind.css), so the CLI's glob code ships, but nothing at
    # runtime executes it: only dev-time tooling on trusted globs does.
    - GHSA-vfj7-8cjw-p6xm
